
name: sqlserver

services:

  # ==========================================
  # Microsoft SQL Server 2022 Developer
  # ==========================================
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_MEMORY_LIMIT_MB: "3072"

    ports:
      - "127.0.0.1:1433:1433"

    volumes:
      - type: bind
        source: /home/vasif/.local/share/sql-engines/sqlserver/data
        target: /var/opt/mssql
        bind:
          create_host_path: false

      - type: bind
        source: /home/vasif/.local/share/sql-engines/backups/sqlserver
        target: /var/opt/mssql-backups
        bind:
          create_host_path: false

    mem_limit: 4g
    cpus: 2.0
    restart: "no"
    stop_grace_period: 60s

  # ==========================================
  # PostgreSQL 18
  # ==========================================
  postgresql:
    image: postgres:18
    container_name: postgresql

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: postgres

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - type: bind
        source: /home/vasif/.local/share/sql-engines/postgresql/data
        target: /var/lib/postgresql
        bind:
          create_host_path: false

      - type: bind
        source: /home/vasif/.local/share/sql-engines/backups/postgresql
        target: /backups
        bind:
          create_host_path: false

    mem_limit: 2g
    cpus: 2.0
    restart: "no"
    stop_grace_period: 60s

  # ==========================================
  # Oracle MySQL Community Server 8.4 LTS
  # ==========================================
  mysql:
    image: mysql:8.4
    container_name: mysql

    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_ROOT_HOST: "localhost"

    ports:
      - "127.0.0.1:3306:3306"

    volumes:
      - type: bind
        source: /home/vasif/.local/share/sql-engines/mysql/data
        target: /var/lib/mysql
        bind:
          create_host_path: false

      - type: bind
        source: /home/vasif/.local/share/sql-engines/backups/mysql
        target: /backups
        bind:
          create_host_path: false

    mem_limit: 2g
    cpus: 2.0
    restart: "no"
    stop_grace_period: 60s

